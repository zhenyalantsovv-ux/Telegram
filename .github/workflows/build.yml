name: Build ZapretGram

on:
  repository_dispatch:
    types: [build_zapretgram]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK 27.2.12479018
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;27.2.12479018"

      - name: Install Python deps
        run: pip install Pillow

      - name: Patch name, icon and features
        env:
          APP_NAME: ${{ github.event.client_payload.app_name || 'ZapretGram' }}
          ICON_B64: ${{ github.event.client_payload.icon_b64 }}
          PROXY_ENABLED: ${{ github.event.client_payload.proxy_enabled }}
          DISABLE_PROXY_ON_VPN: ${{ github.event.client_payload.disable_proxy_on_vpn }}
          HIDE_PHONE: ${{ github.event.client_payload.hide_phone }}
          DISABLE_ADS: ${{ github.event.client_payload.disable_ads }}
          GHOST_MODE: ${{ github.event.client_payload.ghost_mode }}
        run: python scripts/patch.py

      - name: Restore keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p TMessagesProj/config
          echo "$KEYSTORE_B64" | base64 -d > TMessagesProj/config/release.keystore

      - name: Configure signing
        run: |
          echo "RELEASE_STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> gradle.properties
          echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> gradle.properties
          echo "RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> gradle.properties

      - name: Build APK
        run: |
          cd TMessagesProj
          chmod +x gradlew
          ./gradlew assembleTMessageRelease --no-daemon -x lint

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZapretGram-APK
          path: TMessagesProj/build/outputs/apk/release/*.apk
          retention-days: 30
